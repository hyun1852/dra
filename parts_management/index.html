<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부품 및 금형투자비 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-foreground font-sans antialiased min-h-screen">
    <div class="relative flex min-h-screen flex-col">
        <!-- Background Grid (Adaptive) -->
        <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
            <div class="absolute inset-0" style="background: radial-gradient(circle at 50% 50%, var(--radial-start) 0%, var(--radial-end) 100%);"></div>
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(hsl(var(--foreground)) 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
        </div>
        <header class="container mx-auto px-4 py-16 lg:py-24 text-center relative z-10">
            <!-- Theme Toggle Unfixed -->
            <div class="absolute top-6 right-6">
                <button id="theme-toggle" class="px-4 py-2 rounded-md border border-border bg-background/80 backdrop-blur-sm text-sm font-bold hover:bg-accent transition-all shadow-md"></button>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight sm:text-6xl mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
                Module Commonalization & <br/><span class="text-foreground">Mold Investment Dashboard</span>
            </h1>

            <!-- Hero Container (Grayscale) -->
            <div class="relative mx-auto max-w-6xl rounded-xl border border-border bg-background/40 p-2 backdrop-blur-sm shadow-2xl overflow-hidden group">
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 p-6 relative z-10">
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/[0.03] rounded-lg border border-border/50">
                        <span class="text-muted-foreground text-[10px] uppercase tracking-wider">총 도메인 수</span>
                        <span id="total-domains" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/[0.03] rounded-lg border border-border/50">
                        <span class="text-muted-foreground text-[10px] uppercase tracking-wider">총 시스템 수</span>
                        <span id="total-systems" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/[0.03] rounded-lg border border-border/50">
                        <span class="text-muted-foreground text-[10px] uppercase tracking-wider">총 모듈러시스템 수</span>
                        <span id="total-modulars" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/[0.03] rounded-lg border border-border/50">
                        <span class="text-muted-foreground text-[10px] uppercase tracking-wider">총 부품 수</span>
                        <span id="total-parts" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/[0.03] rounded-lg border border-border/50">
                        <span class="text-muted-foreground text-[10px] uppercase tracking-wider">총 사양 수</span>
                        <span id="total-specs" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/10 rounded-lg border border-foreground/20">
                        <span class="text-foreground text-[10px] uppercase tracking-wider font-bold">총 금형투자비(억)</span>
                        <span id="total-cost" class="text-2xl font-bold text-foreground">0</span>
                    </div>
                    <div class="flex flex-col items-center justify-center space-y-2 p-4 bg-foreground/10 rounded-lg border border-foreground/20">
                        <span class="text-foreground text-[10px] uppercase tracking-wider font-bold">금형공용화율</span>
                        <span id="sharing-rate" class="text-2xl font-bold text-foreground">0%</span>
                    </div>
                </div>
            </div>
        </header>

        <main id="dashboard-main" class="container mx-auto px-4 py-12 relative z-10">
            <!-- Filter Section -->
            <div class="mb-12 rounded-xl border border-border bg-background/40 p-6 backdrop-blur-sm shadow-md">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">도메인</label>
                        <select id="domain-filter" class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">시스템</label>
                        <select id="system-filter" class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">모듈러시스템</label>
                        <select id="modular-filter" class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">부품</label>
                        <select id="part-filter" class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">투자비 정렬</label>
                        <select id="sort-order" class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all">
                            <option value="none">기본</option>
                            <option value="desc">금액 높은순</option>
                            <option value="asc">금액 낮은순</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-tighter text-muted-foreground">검색</label>
                        <input type="text" id="search-input" placeholder="차종 검색..." class="w-full bg-background border border-border rounded px-3 py-2 text-sm focus:ring-1 focus:ring-foreground outline-none transition-all">
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                <!-- System Pie Chart -->
                <div class="rounded-xl border border-border bg-background/40 p-8 backdrop-blur-sm shadow-lg">
                    <h3 class="text-sm font-bold uppercase tracking-widest mb-8 text-foreground text-center border-b border-border pb-4">시스템별 금형투자비 비중</h3>
                    <div id="chart-area" class="flex flex-col md:flex-row items-center justify-around gap-8">
                        <div class="relative w-48 h-48 shrink-0">
                            <svg id="mold-chart" class="w-full h-full transform -rotate-90" viewBox="0 0 42 42">
                                <!-- Pie segments -->
                            </svg>
                        </div>
                        <div id="chart-legend" class="flex-1 space-y-3 w-full"></div>
                    </div>
                </div>

                <!-- Sharing Rate Vertical Bar Chart -->
                <div class="rounded-xl border border-border bg-background/40 p-8 backdrop-blur-sm shadow-lg flex flex-col">
                    <h3 class="text-sm font-bold uppercase tracking-widest mb-8 text-foreground text-center border-b border-border pb-4">금형공용화 현황 (투자비 절감)</h3>
                    <div class="flex-1 flex flex-row items-end justify-center gap-12 pt-4 pb-2">
                        <!-- Potential Total Bar -->
                        <div class="flex flex-col items-center gap-4 h-full w-24">
                            <div class="flex-1 w-full bg-secondary/20 border border-border rounded-t-lg relative flex flex-col justify-end overflow-hidden shadow-inner">
                                <div class="h-full w-full bg-muted-foreground/10"></div>
                                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                    <span class="text-[10px] font-bold text-muted-foreground vertical-text transform -rotate-90 whitespace-nowrap">POTENTIAL</span>
                                </div>
                            </div>
                            <div class="text-center space-y-1">
                                <span id="potential-cost-val" class="text-xs font-bold block">0억</span>
                                <span class="text-[8px] uppercase text-muted-foreground font-black tracking-tighter">잠재 총액</span>
                            </div>
                        </div>

                        <!-- Actual Spent Bar -->
                        <div class="flex flex-col items-center gap-4 h-full w-24">
                            <div class="flex-1 w-full bg-secondary/20 border border-border rounded-t-lg relative flex flex-col justify-end overflow-hidden shadow-inner">
                                <div id="actual-spent-bar" class="w-full bg-foreground transition-all duration-1000 ease-out flex items-start justify-center pt-2" style="height: 0%">
                                    <span id="actual-cost-val" class="text-[10px] font-black text-background">0억</span>
                                </div>
                            </div>
                            <div class="text-center space-y-1">
                                <span id="sharing-rate-percent" class="text-sm font-black block text-primary">0%</span>
                                <span class="text-[8px] uppercase text-foreground font-black tracking-tighter">실제 지출</span>
                            </div>
                        </div>

                        <!-- Saved Cost Bar -->
                        <div class="flex flex-col items-center gap-4 h-full w-24">
                            <div class="flex-1 w-full bg-secondary/20 border border-border rounded-t-lg relative flex flex-col justify-end overflow-hidden shadow-inner">
                                <div id="saved-cost-bar" class="w-full bg-secondary transition-all duration-1000 ease-out flex items-start justify-center pt-2" style="height: 0%">
                                    <span id="saved-cost-val" class="text-[10px] font-bold text-foreground">0억</span>
                                </div>
                            </div>
                            <div class="text-center space-y-1">
                                <span id="saved-cost-summary" class="text-xs font-bold block">0억</span>
                                <span class="text-[8px] uppercase text-muted-foreground font-black tracking-tighter">절감 총액</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Area (Full Width) -->
            <div class="rounded-xl border border-border bg-background/40 shadow-lg mb-12">
                <div class="relative overflow-x-auto">
                    <table id="parts-table" class="w-full text-xs text-left border-separate border-spacing-0 min-w-max">
                        <thead class="text-foreground uppercase text-[10px] font-bold">
                            <tr>
                                <th class="px-6 py-4 sticky top-0 z-20">도메인</th>
                                <th class="px-6 py-4 sticky top-0 z-20">시스템</th>
                                <th class="px-6 py-4 sticky top-0 z-20">모듈러시스템</th>
                                <th class="px-6 py-4 sticky top-0 z-20">부품</th>
                                <th class="px-6 py-4 sticky top-0 z-20">사양</th>
                                <th class="px-6 py-4 sticky top-0 z-20 border-r border-border/50">금형투자비(억)</th>
                                <th class="px-6 py-4 sticky top-0 z-20 font-black text-primary border-r border-border/50">총 금형투자비(억)</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">NE2</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">NV1</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">JK2</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">JW2</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">ME2</th>
                                <th class="px-2 py-4 sticky top-0 z-20 text-center">MV2</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-border/30"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="mt-auto border-t border-border py-8 text-center text-muted-foreground text-[10px] uppercase tracking-widest">
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
