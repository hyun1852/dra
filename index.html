<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부품 및 금형투자비 관리 시스템 - 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 0 0% 0%;
            --foreground: 0 0% 100%;
            --border: 0 0% 15%;
            --muted: 0 0% 15%;
            --muted-foreground: 0 0% 65%;
            --accent: 0 0% 15%;
            --radial-start: rgba(20, 20, 20, 1);
            --radial-end: rgba(0, 0, 0, 1);
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }
    </style>
</head>
<body class="bg-background text-foreground font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute inset-0" style="background: radial-gradient(circle at 50% 50%, var(--radial-start) 0%, var(--radial-end) 100%);"></div>
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(hsl(var(--foreground)) 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
    </div>

    <div class="container max-w-4xl px-4 py-16 text-center z-10">
        <h1 class="text-4xl font-extrabold tracking-tight sm:text-6xl mb-12 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
            부품 및 금형투자비 <br/><span class="text-foreground">관리 시스템</span>
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Parts Management Card -->
            <a href="parts_management/index.html" class="group relative rounded-xl border border-border bg-background/40 p-8 backdrop-blur-sm shadow-2xl overflow-hidden transition-all hover:border-foreground/50 hover:bg-foreground/5">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold mb-4">부품 관리 대시보드</h2>
                    <p class="text-muted-foreground text-sm uppercase tracking-widest mb-6">Parts Management Dashboard</p>
                    <ul class="text-left text-xs space-y-2 text-muted-foreground group-hover:text-foreground transition-colors">
                        <li>• 부품 공용화 현황 분석</li>
                        <li>• 시스템별 투자비 비중 확인</li>
                        <li>• 차종별 공용화율 대시보드</li>
                        <li>• 상세 부품 데이터 그리드</li>
                    </ul>
                </div>
                <div class="absolute bottom-4 right-4 opacity-20 group-hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-circle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>
                </div>
            </a>

            <!-- Mold Cost Management Card -->
            <a href="mold_cost_management/index.html" class="group relative rounded-xl border border-border bg-background/40 p-8 backdrop-blur-sm shadow-2xl overflow-hidden transition-all hover:border-foreground/50 hover:bg-foreground/5">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold mb-4">금형투자비 분석</h2>
                    <p class="text-muted-foreground text-sm uppercase tracking-widest mb-6">Mold Cost Analysis</p>
                    <ul class="text-left text-xs space-y-2 text-muted-foreground group-hover:text-foreground transition-colors">
                        <li>• 엑셀 데이터 업로드 분석</li>
                        <li>• 금형 투자비 시뮬레이션</li>
                        <li>• KPI 현황판 (도메인/시스템)</li>
                        <li>• 상세 투자비 테이블 분석</li>
                    </ul>
                </div>
                <div class="absolute bottom-4 right-4 opacity-20 group-hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-circle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>
                </div>
            </a>
        </div>

        <footer class="mt-24 text-muted-foreground text-[10px] uppercase tracking-widest">
            © 2026 부품 및 금형투자비 관리 시스템
        </footer>
    </div>
</body>
</html>
